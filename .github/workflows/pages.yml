name: Update news and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh news feeds
        run: node scripts/update-news.cjs
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html article.html image-credits.html style.css interface.css app.js poster.css poster.js i18n.js selects.js news-shared.js article.js languages.json geo-languages.json city-images.json poster-countries.json countries.json zones.json news.json .nojekyll _site/
          cp -r assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
